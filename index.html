<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행사장 QR 스캐너</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; }
        #result { font-size: 24px; font-weight: bold; margin-top: 20px; color: blue; }
    </style>
</head>
<body>
    <h2>대시보드 실시간 입장 스캐너</h2>
    
    <div id="reader" style="width:100%; max-width:500px; margin: 0 auto;"></div>
    
    <div id="result">대기 중...</div>

    <script>
        // ⚠️ 대표님의 주소와 키를 여기에 꼭 다시 넣어주세요!
        const SUPABASE_URL = "https://[본인프로젝트 URL]/rest/v1/entry_logs"; 
        const SUPABASE_KEY = "[복사한 API 키]";

        let isProcessing = false; 
        let lastScannedId = ""; 
        let lastScanTime = 0;   

        function onScanSuccess(decodedText) {
            if (isProcessing) return; 

            const currentTime = new Date().getTime();

            // 핵심 방어막: 방금 찍은 학번이고 7초가 안 지났으면 철벽 방어!
            if (decodedText === lastScannedId && (currentTime - lastScanTime) < 7000) {
                return; 
            }

            isProcessing = true; 
            lastScannedId = decodedText; 
            lastScanTime = currentTime;  

            html5QrcodeScanner.pause();
            document.getElementById('result').innerText = decodedText + " 학번 전송 중...";
            document.getElementById('result').style.color = "orange";

            fetch(SUPABASE_URL, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ student_id: decodedText }) 
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('result').innerText = decodedText + " ✅ 입장 완료!";
                    document.getElementById('result').style.color = "green";
                } else {
                    document.getElementById('result').innerText = "❌ 전송 실패";
                    document.getElementById('result').style.color = "red";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerText = "❌ 네트워크 오류";
                document.getElementById('result').style.color = "red";
            })
            .finally(() => {
                setTimeout(() => { 
                    document.getElementById('result').innerText = "다음 학생 스캔 대기 중...";
                    document.getElementById('result').style.color = "blue";
                    isProcessing = false; 
                    html5QrcodeScanner.resume(); 
                }, 1000); 
            });
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
