<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행사장 QR 스캐너</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; }
        #reader { width:100%; max-width:500px; margin: 0 auto; }
        #result { font-size: 24px; font-weight: bold; margin-top: 20px; color: blue; }
    </style>
</head>
<body>
    <h2>대시보드 실시간 입장 스캐너</h2>
    
    <div id="reader"></div>
    <div id="result">대기 중...</div>

    <script>
        const SUPABASE_URL = "https://ogsnlvswhvilgoupibha.supabase.co/rest/v1/entry_logs"; 
        const SUPABASE_KEY = "sb_publishable_F5HGrXs4Pm-XGL-gHblOIQ_Z4KRH9bO";

        let isProcessing = false; 
        // 💡 7초간 재입장을 막을 학번 블랙리스트 장부 생성
        const blockList = new Set(); 

        function onScanSuccess(decodedText) {
            // 💡 [방어막 1] 네트워크 전송 중이면 철저히 무시
            if (isProcessing) return; 

            // 💡 [방어막 2] 블랙리스트 장부에 있는 학번이면 7초 동안 무조건 원천 차단!
            if (blockList.has(decodedText)) {
                document.getElementById('result').innerText = `⚠️ ${decodedText} (이미 처리됨, 잠시 후 스캔)`;
                document.getElementById('result').style.color = "purple";
                return; 
            }

            // 문 잠그고 블랙리스트에 학번 등록
            isProcessing = true; 
            blockList.add(decodedText);

            html5QrcodeScanner.pause();
            document.getElementById('result').innerText = decodedText + " 학번 전송 중...";
            document.getElementById('result').style.color = "orange";

            fetch(SUPABASE_URL, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ student_id: decodedText }) 
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('result').innerText = decodedText + " ✅ 입장 완료!";
                    document.getElementById('result').style.color = "green";
                } else {
                    document.getElementById('result').innerText = "❌ 전송 실패";
                    document.getElementById('result').style.color = "red";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerText = "❌ 네트워크 오류";
                document.getElementById('result').style.color = "red";
            })
            .finally(() => {
                // 💡 전송이 끝난 후 1.5초 뒤에 카메라는 켜서 다음 사람을 받되, 
                // 방금 찍은 사람은 블랙리스트에 여전히 묶여있습니다.
                setTimeout(() => { 
                    document.getElementById('result').innerText = "다음 학생 스캔 대기 중...";
                    document.getElementById('result').style.color = "blue";
                    isProcessing = false; 
                    html5QrcodeScanner.resume(); 
                }, 1500); 

                // 💡 [핵심 장치] 정확히 7초가 지나야 블랙리스트 장부에서 학번을 지워줍니다.
                setTimeout(() => {
                    blockList.delete(decodedText);
                    console.log(`${decodedText} 학번 잠금 해제`);
                }, 7000);
            });
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
