<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행사장 QR 스캐너</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; }
        #reader { width:100%; max-width:500px; margin: 0 auto; }
        #result { font-size: 24px; font-weight: bold; margin-top: 20px; color: blue; }
    </style>
</head>
<body>
    <h2>대시보드 실시간 입장 스캐너</h2>
    
    <div id="reader"></div>
    <div id="result">대기 중...</div>

    <script>
        const SUPABASE_URL = "https://ogsnlvswhvilgoupibha.supabase.co/rest/v1/entry_logs"; 
        const SUPABASE_KEY = "sb_publishable_F5HGrXs4Pm-XGL-gHblOIQ_Z4KRH9bO";

        let isProcessing = false; 
        let lastScannedId = ""; 
        let lastScanTime = 0;   

        function onScanSuccess(decodedText) {
            const currentTime = new Date().getTime();

            // 💡 [핵심 방어막 1] 네트워크 전송 중이면 무조건 튕겨냅니다.
            if (isProcessing) return; 

            // 💡 [핵심 방어막 2] 동일 학번 연타 방지 (마지막 스캔 후 7초 안 지났으면 메시지만 띄우고 차단)
            if (decodedText === lastScannedId && (currentTime - lastScanTime) < 7000) {
                document.getElementById('result').innerText = `⚠️ ${decodedText} (이미 처리됨, 잠시 후 스캔)`;
                document.getElementById('result').style.color = "purple";
                return; 
            }

            // 스캔 승인 -> 문 잠그기
            isProcessing = true; 
            lastScannedId = decodedText; 
            lastScanTime = currentTime;  

            html5QrcodeScanner.pause();
            document.getElementById('result').innerText = decodedText + " 학번 전송 중...";
            document.getElementById('result').style.color = "orange";

            fetch(SUPABASE_URL, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ student_id: decodedText }) 
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('result').innerText = decodedText + " ✅ 입장 완료!";
                    document.getElementById('result').style.color = "green";
                } else {
                    document.getElementById('result').innerText = "❌ 전송 실패";
                    document.getElementById('result').style.color = "red";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerText = "❌ 네트워크 오류";
                document.getElementById('result').style.color = "red";
            })
            .finally(() => {
                // 💡 1.5초 후에 다음 사람을 위해 스캐너를 깹니다.
                setTimeout(() => { 
                    document.getElementById('result').innerText = "다음 학생 스캔 대기 중...";
                    document.getElementById('result').style.color = "blue";
                    
                    // 스캐너는 켜지지만, 이전에 찍은 사람은 위쪽 [방어막 2]에 걸려 7초간 전송이 차단됩니다.
                    isProcessing = false; 
                    html5QrcodeScanner.resume(); 
                }, 1500); 
            });
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
