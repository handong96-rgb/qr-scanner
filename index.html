<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행사장 QR 스캐너</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; }
        #result { font-size: 24px; font-weight: bold; margin-top: 20px; color: blue; }
  <script>
        const SUPABASE_URL = "https://[본인프로젝트 URL]/rest/v1/entry_logs"; 
        const SUPABASE_KEY = "[복사한 API 키]";

        let isProcessing = false; 
        let lastScannedId = ""; // 🔒 방금 찍은 학번을 기억하는 변수
        let lastScanTime = 0;   // 🔒 방금 찍은 시간을 기억하는 변수

        function onScanSuccess(decodedText) {
            if (isProcessing) return; 

            const currentTime = new Date().getTime();

            // 핵심 로직: 방금 찍은 사람과 '똑같은 학번'이고, '7초'가 안 지났다면 완벽 무시!
            if (decodedText === lastScannedId && (currentTime - lastScanTime) < 7000) {
                return; 
            }

            isProcessing = true; 
            lastScannedId = decodedText; // 지금 찍은 학번 기억
            lastScanTime = currentTime;  // 지금 찍은 시간 기억

            html5QrcodeScanner.pause();
            document.getElementById('result').innerText = decodedText + " 학번 전송 중...";
            document.getElementById('result').style.color = "orange";

            fetch(SUPABASE_URL, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ student_id: decodedText }) 
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('result').innerText = decodedText + " ✅ 입장 완료!";
                    document.getElementById('result').style.color = "green";
                } else {
                    document.getElementById('result').innerText = "❌ 전송 실패";
                    document.getElementById('result').style.color = "red";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerText = "❌ 네트워크 오류";
                document.getElementById('result').style.color = "red";
            })
            .finally(() => {
                // 처리가 끝나면 1초 뒤에 스캐너만 다시 켬 (동일 인물 7초 제한은 계속 유지됨)
                setTimeout(() => { 
                    document.getElementById('result').innerText = "다음 학생 스캔 대기 중...";
                    document.getElementById('result').style.color = "blue";
                    isProcessing = false; 
                    html5QrcodeScanner.resume(); 
                }, 1000); 
            });
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
